name: Android widget instrumented tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  widget-emulator:
    name: Widget tests (${{ matrix.device.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - { name: phone, profile: pixel_6 }
          - { name: tablet, profile: pixel_c }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::error::KVM unavailable on runner"
            exit 1
          fi
      - name: Run Android widget instrumentation on ${{ matrix.device.name }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.device.profile }}
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-instrumentation-${{ matrix.device.name }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
